# 无监督STN配置 - DTD 纹理分类数据集
# 用于无监督训练实验（不使用标签信息）
# 阶段一: 冻结CLIP → Local + Fused
# 阶段二: fused ↔ local 对称一致性

# === 基础模型配置 ===
model_size: ViT-B/32
dataset: dtd
data_path: /mnt/e3319bd7-a0cc-41a8-9825-36b781a06ce8/xzy/project/WCA/data/dtd

# === STN核心配置 ===
stn_config:
  hidden_dim: 256
  dropout: 0.1
  num_views: 4
  fusion_mode: transformer

  transformer_heads: 8
  transformer_layers: 2
  transformer_dropout: 0.1

  logits_temp: 0.07

  fairness_weight: 0.0
  decorrelation_weight: 0.0

  two_stage:
    warmup_epochs: 15

    teacher_temp: 0.05   # CLIP教师温度 尖锐一点好
    warmup_student_temp: 0.09   # 学生温度 比教师软
    warmup_local_weight: 1.0
    warmup_fused_weight: 1.0

    dec_student_temp: 0.15
    centering_momentum: 0.9   # teacher logits softmax前减去中心向量

# === 训练配置 ===
training:
  epochs: 100
  batch_size: 64
  num_workers: 8

  optimizer: adamw
  learning_rate: 5e-5
  weight_decay: 1e-2
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  mixed_precision: false

  patience: 8
  eta_min: 1e-6

  warmup_epochs: 5
  warmup_factor: 0.1

  max_grad_norm: 1.0
  grad_norm_type: 2.0
